[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-colosseum"
version = "0.1.0"
description = "Standalone Vulhub and CTF-Dojo lifecycle controller for Luc1-MAGI"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
magi-colosseum = "magi_colosseum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magi_colosseum = ["web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
